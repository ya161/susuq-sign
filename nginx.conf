server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态文件缓存
    location /_next/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 所有路由回退到 index.html（SPA）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
