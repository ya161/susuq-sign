name: Build Unsigned IPA

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Check iOS Platform
        run: |
          echo "=== 已安装的SDK ==="
          xcodebuild -showsdks 2>&1 | grep -i ios || true
          echo "=== Xcode 路径 ==="
          xcode-select -p
          echo "=== 已安装的平台 ==="
          ls /Applications/Xcode*.app/Contents/Developer/Platforms/ 2>/dev/null || true
          ls /Library/Developer/CommandLineTools/Platforms/ 2>/dev/null || true
          echo "=== 已安装的运行时 ==="
          xcrun simctl runtime list 2>&1 || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build IPA
        run: |
          cd ios
          set -eo pipefail
          echo "=== Xcode 版本 ==="
          xcodebuild -version
          echo "=== 可用 iOS SDK ==="
          xcodebuild -showsdks 2>&1 | grep -i "iphoneos" || true
          echo "=== 开始构建 ==="
          # 使用 SDKROOT 直接指定 iphoneos，不依赖 -destination
          xcodebuild -project JiSign.xcodeproj \
            -scheme JiSign \
            -configuration Release \
            -derivedDataPath build \
            SDKROOT=iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO 2>&1 | tee build.log | tail -100
          echo "✅ Build completed"

      - name: Create IPA
        run: |
          cd ios
          echo "=== 查找 JiSign.app ==="
          APP_DIR=$(find build -name "JiSign.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "❌ JiSign.app 未找到"
            echo "--- 构建目录内容 ---"
            find build -maxdepth 5 -type d 2>/dev/null | head -30
            echo "--- build.log 最后80行 ---"
            tail -80 build.log 2>/dev/null || true
            exit 1
          fi
          echo "✅ 找到: $APP_DIR"
          # 检查主程序文件
          if [ ! -f "$APP_DIR/JiSign" ]; then
            echo "❌ 主程序文件缺失！内容:"
            ls -la "$APP_DIR/" | head -20
            exit 1
          fi
          echo "✅ 主程序: $(du -h "$APP_DIR/JiSign" | cut -f1)"
          # 创建 IPA
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r JiSign-unsigned.ipa Payload/
          rm -rf Payload
          echo "=== IPA 信息 ==="
          ls -lh JiSign-unsigned.ipa
          unzip -l JiSign-unsigned.ipa | head -20
          # 移动到工作区根目录
          cp JiSign-unsigned.ipa ../
          echo "✅ IPA 已复制到: $(pwd)/../JiSign-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JiSign-unsigned
          path: JiSign-unsigned.ipa
          retention-days: 30
