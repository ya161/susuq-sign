name: Build Unsigned IPA

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build IPA
        run: |
          cd ios
          xcodebuild -project JiSign.xcodeproj \
            -scheme JiSign \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -sdk iphoneos \
            SUPPORTED_PLATFORMS=iphoneos \
            ENABLE_PREVIEWS=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO

      - name: Create IPA
        run: |
          mkdir -p ipa/Payload
          cp -r ios/build/Build/Products/Release-iphoneos/JiSign.app ipa/Payload/
          cd ipa
          zip -r ../JiSign-unsigned.ipa Payload/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JiSign-unsigned
          path: JiSign-unsigned.ipa
          retention-days: 30
