name: Build Unsigned IPA

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Check iOS Platform
        run: |
          echo "=== 已安装的SDK ==="
          xcodebuild -showsdks 2>&1 | grep -i ios || true
          echo "=== Xcode 路径 ==="
          xcode-select -p
          echo "=== 已安装的平台 ==="
          ls /Applications/Xcode*.app/Contents/Developer/Platforms/ 2>/dev/null || true
          ls /Library/Developer/CommandLineTools/Platforms/ 2>/dev/null || true
          echo "=== 已安装的运行时 ==="
          xcrun simctl runtime list 2>&1 || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build IPA
        run: |
          cd ios
          set -eo pipefail
          echo "=== Xcode 版本 ==="
          xcodebuild -version
          echo "=== 可用 iOS SDK ==="
          xcodebuild -showsdks 2>&1 | grep -i "iphoneos" || true
          echo "=== 开始构建 ==="
          # 使用 SDKROOT 直接指定 iphoneos，不依赖 -destination
          xcodebuild -project JiSign.xcodeproj \
            -scheme JiSign \
            -configuration Release \
            -derivedDataPath build \
            SDKROOT=iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO 2>&1 | tee build.log | tail -100
          echo "✅ Build completed"

      - name: Create IPA
        run: |
          cd ios
          APP_DIR="build/Build/Products/Release-iphoneos/JiSign.app"
          echo "--- 构建输出目录 ---"
          find "$APP_DIR" -type f | head -30
          echo "--- 检查主程序 ---"
          if [ ! -f "$APP_DIR/JiSign" ]; then
            echo "❌ 主程序文件缺失！"
            echo "--- build.log 最后50行 ---"
            tail -50 build.log 2>/dev/null || true
            echo "--- 完整构建目录 ---"
            find build/ -maxdepth 5 -type f -name "JiSign*" 2>/dev/null
            exit 1
          fi
          echo "✅ 主程序文件存在，大小: $(du -h "$APP_DIR/JiSign" | cut -f1)"
          mkdir -p ipa/Payload
          cp -r "$APP_DIR" ipa/Payload/
          cd ipa
          zip -r ../JiSign-unsigned.ipa Payload/
          echo "--- IPA 内容 ---"
          unzip -l ../JiSign-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JiSign-unsigned
          path: JiSign-unsigned.ipa
          retention-days: 30
