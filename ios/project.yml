name: JiSign
options:
  bundleIdPrefix: com.susuq
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.51"
    CURRENT_PROJECT_VERSION: "48"

packages:
  zsign:
    url: https://github.com/zwsn/zsign-ios
    branch: main
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
  ZipArchive:
    url: https://github.com/ZipArchive/ZipArchive
    from: "2.6.0"

targets:
  JiSign:
    type: application
    platform: iOS
    sources:
      - path: JiSign
        excludes:
          - "Libs/**"
          - "Core/SignEngine/Tweaks/**"
    dependencies:
      - package: zsign
        product: ZSignApple
      - package: ZIPFoundation
      - package: ZipArchive
    settings:
      base:
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "速签"
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_OBJC_BRIDGING_HEADER: JiSign/JiSign-Bridging-Header.h
    info:
      path: JiSign/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "速签"
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsArbitraryLoadsInWebContent: true
          NSExceptionDomains:
            39.96.76.211:
              NSExceptionAllowsInsecureHTTPLoads: true
            local.susuq.top:
              NSExceptionAllowsInsecureHTTPLoads: false
              NSIncludesSubdomains: true
        UILaunchScreen: {}
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: "IPA File"
            LSHandlerRank: "Default"
            LSItemContentTypes:
              - "com.apple.itunes.ipa"
            CFBundleTypeExtensions:
              - "ipa"
          - CFBundleTypeName: "P12 Certificate"
            LSHandlerRank: "Default"
            CFBundleTypeExtensions:
              - "p12"
          - CFBundleTypeName: "Mobile Provision"
            LSHandlerRank: "Default"
            CFBundleTypeExtensions:
              - "mobileprovision"
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: "com.apple.itunes.ipa"
            UTTypeDescription: "iOS App Archive"
            UTTypeConformsTo:
              - "public.data"
              - "public.archive"
            UTTypeTagSpecification:
              public.filename-extension:
                - "ipa"
